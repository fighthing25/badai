name: Build and Release Badai

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore Badai.sln

      - name: Publish Windows app
        shell: pwsh
        run: |
          dotnet publish BadaiNotch/BadaiNotch.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -o publish

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y

      - name: Ensure installer output folder exists
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer/Output | Out-Null

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/BadaiNotch.iss

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            installer/Output/Badai-Setup.exe
